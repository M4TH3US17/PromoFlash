version: '3.8'

services:
  db:
    image: postgres:15.4-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: promoflash_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    restart: always
    networks:
      - promoflash-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: matheusdalvino50@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: always
    networks:
      - promoflash-network

